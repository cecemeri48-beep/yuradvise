<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="90" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Scale base -->
  <rect x="86" y="110" width="20" height="50" rx="3" fill="url(#grad2)"/>
  
  <!-- Scale beam -->
  <rect x="50" y="65" width="92" height="12" rx="6" fill="url(#grad2)"/>
  
  <!-- Left pan -->
  <path d="M 50 77 L 30 105 Q 28 110 35 110 L 65 110 Q 72 110 70 105 L 50 77" fill="url(#grad2)" stroke="#b45309" stroke-width="1"/>
  
  <!-- Right pan -->
  <path d="M 142 77 L 122 105 Q 120 110 127 110 L 157 110 Q 164 110 162 105 L 142 77" fill="url(#grad2)" stroke="#b45309" stroke-width="1"/>
  
  <!-- Center pillar -->
  <rect x="88" y="55" width="16" height="18" rx="2" fill="url(#grad2)"/>
  
  <!-- Blue band (representing digital/access) -->
  <rect x="42" y="50" width="108" height="8" rx="4" fill="#0ea5e9"/>
  
  <!-- Decorative dots -->
  <circle cx="35" cy="105" r="3" fill="#fbbf24"/>
  <circle cx="157" cy="105" r="3" fill="#fbbf24"/>
</svg>
