<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gold metallic gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gold darker -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Blue band gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7dd3fc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter for 3D effect -->
    <filter id="shadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Inner shadow for emboss -->
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="3" dy="3" result="offsetBlur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant=".75" specularExponent="20" lighting-color="#fff" result="specOut">
        <fePointLight x="-5000" y="-10000" z="20000"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint"/>
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#shadow3D)"/>
  
  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#blueGrad)" stroke-width="3" opacity="0.5"/>
  
  <!-- Main sword/knife body - LEFT SIDE -->
  <!-- Blade -->
  <path d="M 120 100 Q 120 280 140 380 L 200 420 L 180 440 L 100 390 Q 80 280 90 100 Z" 
        fill="url(#goldGrad)" filter="url(#emboss)" stroke="#92400e" stroke-width="2"/>
  
  <!-- Blade highlight -->
  <path d="M 125 110 Q 125 270 142 370 L 185 410 L 180 415 L 140 375 Q 122 270 120 110 Z" 
        fill="rgba(255,255,255,0.3)"/>
  
  <!-- Blade edge shine -->
  <path d="M 115 150 Q 112 250 135 360" 
        fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- RIGHT SIDE - handle -->
  <!-- Handle base -->
  <path d="M 200 380 L 340 380 Q 360 380 360 400 L 360 460 Q 360 480 340 480 L 200 480 Z" 
        fill="url(#goldDark)" filter="url(#shadow3D)"/>
  
  <!-- Handle details - grip lines -->
  <line x1="220" y1="400" x2="220" y2="460" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="400" x2="250" y2="460" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="400" x2="280" y2="460" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <line x1="310" y1="400" x2="310" y2="460" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Handle highlight -->
  <path d="M 210 390 L 330 390 Q 345 390 345 405 L 345 440 Q 345 450 335 455 L 210 455 Z" 
        fill="rgba(255,255,255,0.15)"/>
  
  <!-- Blue band around handle -->
  <rect x="200" y="420" width="160" height="25" rx="5" fill="url(#blueGrad)" filter="url(#shadow3D)"/>
  
  <!-- Blue band highlight -->
  <rect x="205" y="423" width="150" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Pommel (bottom decoration) -->
  <path d="M 180 460 L 380 460 Q 390 460 390 470 L 390 480 Q 390 490 380 490 L 180 490 Q 170 490 170 480 L 170 470 Q 170 460 180 460 Z" 
        fill="url(#goldGrad)" filter="url(#emboss)"/>
  
  <!-- Center star/decoration on pommel -->
  <circle cx="280" cy="475" r="12" fill="url(#blueGrad)" filter="url(#glow)"/>
  <circle cx="280" cy="475" r="6" fill="#0ea5e9"/>
  
  <!-- Top guard/ricasso -->
  <path d="M 180 360 L 380 360 Q 390 360 390 370 L 390 385 Q 390 395 380 395 L 180 395 Q 170 395 170 385 L 170 370 Q 170 360 180 360 Z" 
        fill="url(#goldGrad)" filter="url(#shadow3D)"/>
  
  <!-- Guard highlight -->
  <path d="M 185 365 L 375 365 L 375 375 L 185 375 Z" fill="rgba(255,255,255,0.25)"/>
  
  <!-- Decorative rivets on guard -->
  <circle cx="200" cy="380" r="5" fill="#92400e"/>
  <circle cx="200" cy="380" r="2.5" fill="#fbbf24"/>
  <circle cx="360" cy="380" r="5" fill="#92400e"/>
  <circle cx="360" cy="380" r="2.5" fill="#fbbf24"/>
  
  <!-- Sparkle effects -->
  <path d="M 150 120 L 155 135 L 170 140 L 155 145 L 150 160 L 145 145 L 130 140 L 145 135 Z" 
        fill="#fef3c7" opacity="0.8"/>
  <path d="M 320 200 L 324 212 L 336 216 L 324 220 L 320 232 L 316 220 L 304 216 L 316 212 Z" 
        fill="#fef3c7" opacity="0.7"/>
  
  <!-- BADIK text -->
  <text x="256" y="270" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" filter="url(#shadow3D)">
    BADIK
  </text>
  
  <!-- Text highlight -->
  <text x="254" y="268" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="rgba(255,255,255,0.3)">
    BADIK
  </text>
</svg>
