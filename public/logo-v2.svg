<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient - deep blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gold metallic gradient for blade -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    
    <!-- Darker gold for handle -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Blue band gradient -->
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7dd3fc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    
    <!-- 3D shadow filter -->
    <filter id="shadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Inner glow for embossed effect -->
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="4" dy="4" result="offsetBlur"/>
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="0.8" specularExponent="25" lighting-color="#fff" result="specOut">
        <fePointLight x="-5000" y="-10000" z="20000"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint"/>
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    
    <!-- Glow for center gem -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" filter="url(#shadow3D)"/>
  
  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#bandGrad)" stroke-width="3" opacity="0.6"/>
  
  <!-- BADIK DAGGER - Main Body -->
  <g filter="url(#emboss)">
    <!-- BLADE - Curved upward shape -->
    <path d="
      M 256 60 
      Q 320 60 340 120 
      Q 360 180 340 250 
      Q 320 320 280 380 
      L 260 400 
      L 252 420 
      L 240 400 
      L 232 380 
      Q 192 320 172 250 
      Q 152 180 172 120 
      Q 192 60 256 60 Z
    " fill="url(#bladeGrad)" stroke="#92400e" stroke-width="2"/>
    
    <!-- Blade center ridge (3D effect) -->
    <path d="
      M 256 75 
      Q 305 75 325 125 
      Q 340 180 325 245 
      Q 310 310 270 370
      L 256 390
      L 242 370
      Q 202 310 187 245 
      Q 172 180 187 125 
      Q 207 75 256 75 Z
    " fill="rgba(255,255,255,0.25)"/>
    
    <!-- Blade edge highlight (left side) -->
    <path d="
      M 240 80 
      Q 185 80 170 130 
      Q 155 180 175 245 
      Q 195 310 235 365
    " fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Blade edge highlight (right side) -->
    <path d="
      M 272 365
      Q 312 310 332 245 
      Q 352 180 337 130 
      Q 322 80 266 80
    " fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- HANDLE - Below blade -->
    <path d="
      M 220 400 
      L 292 400 
      Q 310 400 310 415 
      L 310 470 
      Q 310 485 292 485 
      L 220 485 
      Q 202 485 202 470 
      L 202 415 
      Q 202 400 220 400 Z
    " fill="url(#handleGrad)" stroke="#78350f" stroke-width="2"/>
    
    <!-- Handle grip lines (wrapped cord effect) -->
    <line x1="215" y1="415" x2="297" y2="415" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <line x1="212" y1="435" x2="300" y2="435" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <line x1="210" y1="455" x2="302" y2="455" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <line x1="208" y1="470" x2="304" y2="470" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Handle highlight -->
    <path d="
      M 225 405 
      L 287 405 
      Q 303 405 303 418 
      L 303 460 
      Q 303 478 287 478 
      L 225 478 
      Q 209 478 209 460 
      L 209 418 
      Q 209 405 225 405 Z
    " fill="rgba(255,255,255,0.15)"/>
    
    <!-- BLUE BAND around handle (as in original image) -->
    <rect x="210" y="438" width="92" height="22" rx="4" fill="url(#bandGrad)" filter="url(#shadow3D)"/>
    <rect x="212" y="440" width="88" height="8" rx="3" fill="rgba(255,255,255,0.4)"/>
    
    <!-- Pommel (bottom cap) -->
    <path d="
      M 215 485 
      L 297 485 
      Q 315 485 315 500 
      L 315 515 
      Q 315 530 297 530 
      L 215 530 
      Q 197 530 197 515 
      L 197 500 
      Q 197 485 215 485 Z
    " fill="url(#bladeGrad)" stroke="#92400e" stroke-width="2"/>
    
    <!-- Center gem/decoration on pommel -->
    <circle cx="256" cy="507" r="14" fill="url(#bandGrad)" filter="url(#glow)"/>
    <circle cx="256" cy="507" r="8" fill="#0ea5e9"/>
    <circle cx="254" cy="505" r="4" fill="rgba(255,255,255,0.6)"/>
    
    <!-- GUARD (cross-piece between blade and handle) -->
    <path d="
      M 190 385 
      L 322 385 
      Q 335 385 335 395 
      L 335 410 
      Q 335 420 322 420 
      L 190 420 
      Q 177 420 177 410 
      L 177 395 
      Q 177 385 190 385 Z
    " fill="url(#bladeGrad)" stroke="#92400e" stroke-width="2" filter="url(#shadow3D)"/>
    
    <!-- Guard highlight -->
    <path d="
      M 195 390 
      L 317 390 
      L 317 398 
      L 195 398 Z
    " fill="rgba(255,255,255,0.3)"/>
    
    <!-- Rivets on guard -->
    <circle cx="195" cy="405" r="6" fill="#92400e"/>
    <circle cx="195" cy="405" r="3" fill="#fbbf24"/>
    <circle cx="317" cy="405" r="6" fill="#92400e"/>
    <circle cx="317" cy="405" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- SPARKLE EFFECTS -->
  <g fill="#fef3c7" opacity="0.9">
    <!-- Sparkle 1 -->
    <path d="M 160 100 L 165 115 L 180 120 L 165 125 L 160 140 L 155 125 L 140 120 L 155 115 Z"/>
    <!-- Sparkle 2 -->
    <path d="M 350 180 L 354 192 L 366 196 L 354 200 L 350 212 L 346 200 L 334 196 L 346 192 Z"/>
    <!-- Sparkle 3 -->
    <path d="M 200 40 L 203 50 L 213 53 L 203 56 L 200 66 L 197 56 L 187 53 L 197 50 Z" opacity="0.7"/>
  </g>
  
  <!-- BADIK TEXT at bottom -->
  <text x="256" y="590" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#ffffff" filter="url(#shadow3D)">
    BADIK
  </text>
</svg>
