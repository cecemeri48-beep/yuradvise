<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BADIK Logo Preview</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f9ff;
      font-family: Arial, sans-serif;
    }
    .container {
      text-align: center;
    }
    .logo-preview {
      width: 200px;
      height: 200px;
      margin-bottom: 20px;
    }
    .sizes {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-end;
    }
    .size-item {
      text-align: center;
    }
    .size-item svg {
      display: block;
      margin: 0 auto 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="color: #0369a1; margin-bottom: 30px;">BADIK Logo</h1>
    
    <div class="logo-preview">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
          </linearGradient>
          <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
          </linearGradient>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
          </filter>
        </defs>
        
        <!-- Background -->
        <circle cx="96" cy="96" r="90" fill="url(#bg)" filter="url(#shadow)"/>
        
        <!-- Scale base -->
        <rect x="86" y="110" width="20" height="50" rx="3" fill="url(#gold)"/>
        
        <!-- Scale beam -->
        <rect x="50" y="65" width="92" height="12" rx="6" fill="url(#gold)"/>
        
        <!-- Left pan -->
        <path d="M 50 77 L 30 105 Q 28 110 35 110 L 65 110 Q 72 110 70 105 L 50 77" fill="url(#gold)" stroke="#b45309" stroke-width="2"/>
        
        <!-- Right pan -->
        <path d="M 142 77 L 122 105 Q 120 110 127 110 L 157 110 Q 164 110 162 105 L 142 77" fill="url(#gold)" stroke="#b45309" stroke-width="2"/>
        
        <!-- Center pillar -->
        <rect x="88" y="55" width="16" height="18" rx="2" fill="url(#gold)"/>
        
        <!-- Blue band (digital access) -->
        <rect x="42" y="50" width="108" height="8" rx="4" fill="#38bdf8"/>
        
        <!-- Decorative dots -->
        <circle cx="35" cy="108" r="5" fill="#fbbf24"/>
        <circle cx="157" cy="108" r="5" fill="#fbbf24"/>
      </svg>
    </div>

    <div class="sizes">
      <div class="size-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="64" height="64">
          <defs>
            <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#0284c7"/>
              <stop offset="100%" style="stop-color:#0369a1"/>
            </linearGradient>
            <linearGradient id="gold1" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#fbbf24"/>
              <stop offset="100%" style="stop-color:#d97706"/>
            </linearGradient>
          </defs>
          <circle cx="96" cy="96" r="90" fill="url(#bg1)"/>
          <rect x="86" y="110" width="20" height="50" rx="3" fill="url(#gold1)"/>
          <rect x="50" y="65" width="92" height="12" rx="6" fill="url(#gold1)"/>
          <path d="M 50 77 L 30 105 Q 28 110 35 110 L 65 110 Q 72 110 70 105 L 50 77" fill="url(#gold1)" stroke="#b45309" stroke-width="2"/>
          <path d="M 142 77 L 122 105 Q 120 110 127 110 L 157 110 Q 164 110 162 105 L 142 77" fill="url(#gold1)" stroke="#b45309" stroke-width="2"/>
          <rect x="88" y="55" width="16" height="18" rx="2" fill="url(#gold1)"/>
          <rect x="42" y="50" width="108" height="8" rx="4" fill="#38bdf8"/>
          <circle cx="35" cy="108" r="5" fill="#fbbf24"/>
          <circle cx="157" cy="108" r="5" fill="#fbbf24"/>
        </svg>
        <small>64px</small>
      </div>
      <div class="size-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="128" height="128">
          <defs>
            <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#0284c7"/>
              <stop offset="100%" style="stop-color:#0369a1"/>
            </linearGradient>
            <linearGradient id="gold2" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#fbbf24"/>
              <stop offset="100%" style="stop-color:#d97706"/>
            </linearGradient>
          </defs>
          <circle cx="96" cy="96" r="90" fill="url(#bg2)"/>
          <rect x="86" y="110" width="20" height="50" rx="3" fill="url(#gold2)"/>
          <rect x="50" y="65" width="92" height="12" rx="6" fill="url(#gold2)"/>
          <path d="M 50 77 L 30 105 Q 28 110 35 110 L 65 110 Q 72 110 70 105 L 50 77" fill="url(#gold2)" stroke="#b45309" stroke-width="2"/>
          <path d="M 142 77 L 122 105 Q 120 110 127 110 L 157 110 Q 164 110 162 105 L 142 77" fill="url(#gold2)" stroke="#b45309" stroke-width="2"/>
          <rect x="88" y="55" width="16" height="18" rx="2" fill="url(#gold2)"/>
          <rect x="42" y="50" width="108" height="8" rx="4" fill="#38bdf8"/>
          <circle cx="35" cy="108" r="5" fill="#fbbf24"/>
          <circle cx="157" cy="108" r="5" fill="#fbbf24"/>
        </svg>
        <small>128px</small>
      </div>
      <div class="size-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
          <defs>
            <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#0284c7"/>
              <stop offset="100%" style="stop-color:#0369a1"/>
            </linearGradient>
            <linearGradient id="gold3" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#fbbf24"/>
              <stop offset="100%" style="stop-color:#d97706"/>
            </linearGradient>
          </defs>
          <circle cx="96" cy="96" r="90" fill="url(#bg3)"/>
          <rect x="86" y="110" width="20" height="50" rx="3" fill="url(#gold3)"/>
          <rect x="50" y="65" width="92" height="12" rx="6" fill="url(#gold3)"/>
          <path d="M 50 77 L 30 105 Q 28 110 35 110 L 65 110 Q 72 110 70 105 L 50 77" fill="url(#gold3)" stroke="#b45309" stroke-width="2"/>
          <path d="M 142 77 L 122 105 Q 120 110 127 110 L 157 110 Q 164 110 162 105 L 142 77" fill="url(#gold3)" stroke="#b45309" stroke-width="2"/>
          <rect x="88" y="55" width="16" height="18" rx="2" fill="url(#gold3)"/>
          <rect x="42" y="50" width="108" height="8" rx="4" fill="#38bdf8"/>
          <circle cx="35" cy="108" r="5" fill="#fbbf24"/>
          <circle cx="157" cy="108" r="5" fill="#fbbf24"/>
        </svg>
        <small>192px</small>
      </div>
    </div>
  </div>
</body>
</html>
